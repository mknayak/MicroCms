name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/microcms-webhost

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build & Unit Tests ────────────────────────────────────────────────
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore MicroCMS.sln

      - name: Build
        run: dotnet build MicroCMS.sln --no-restore -c Release

      - name: Run domain unit tests
        run: >
          dotnet test tests/MicroCMS.Domain.UnitTests/MicroCMS.Domain.UnitTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=domain.trx"
          --collect:"XPlat Code Coverage"

      - name: Run application unit tests
        run: >
          dotnet test tests/MicroCMS.Application.UnitTests/MicroCMS.Application.UnitTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=application.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/*.trx"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"

  # ── 2. Architecture Tests ────────────────────────────────────────────────
  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build
        run: dotnet build MicroCMS.sln --no-restore -c Release || dotnet restore MicroCMS.sln && dotnet build MicroCMS.sln -c Release

      - name: Architecture tests
        run: >
          dotnet test tests/MicroCMS.Architecture.Tests/MicroCMS.Architecture.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=architecture.trx"

  # ── 3. E2E Tests ─────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build
        run: dotnet restore MicroCMS.sln && dotnet build MicroCMS.sln -c Release

      - name: E2E tests
        run: >
          dotnet test tests/MicroCMS.E2E.Tests/MicroCMS.E2E.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=e2e.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: "**/*.trx"

  # ── 4. API Contract Tests ────────────────────────────────────────────────
  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build
        run: dotnet restore MicroCMS.sln && dotnet build MicroCMS.sln -c Release

      - name: Contract tests
        run: >
          dotnet test tests/MicroCMS.Api.ContractTests/MicroCMS.Api.ContractTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=contract.trx"

  # ── 5. Vulnerability Scan ────────────────────────────────────────────────
  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MicroCMS.sln

      - name: Scan for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-scan.txt

      - name: Fail on HIGH/CRITICAL vulnerabilities
        run: |
          if grep -qiE "(Critical|High)" vuln-scan.txt; then
            echo "❌ High or Critical vulnerabilities found:"
            grep -iE "(Critical|High)" vuln-scan.txt
            exit 1
          fi
          echo "✅ No High/Critical vulnerabilities found."

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan
          path: vuln-scan.txt

  # ── 6. SAST (CodeQL) ────────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for CodeQL
        run: dotnet build MicroCMS.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── 7. Container Build & Push ────────────────────────────────────────────
  container-build:
    name: Container Build & Push
    runs-on: ubuntu-latest
    needs: [architecture-tests, e2e-tests, contract-tests, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webhost
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
